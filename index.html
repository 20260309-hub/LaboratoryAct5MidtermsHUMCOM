<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lastname – HTML Form Activity</title>
</head>
<body>

    <h1>HTML Form</h1>

    <form action="#" method="post">
        
        <fieldset>
            <legend>Personal Information</legend>
            <p>
                <label for="user-name">Name:</label><br>
                <input type="text" id="user-name" name="userName" required>
            </p>
            <p>
                <label for="user-email">Email:</label><br>
                <input type="email" id="user-email" name="userEmail" required>
            </p>
        </fieldset>

        <fieldset>
            <legend>Gender</legend>
            <p>
                <input type="radio" id="gender-male" name="gender" value="Male">
                <label for="gender-male">Male</label><br>
                
                <input type="radio" id="gender-female" name="gender" value="Female">
                <label for="gender-female">Female</label><br>
                
                <input type="radio" id="gender-other" name="gender" value="Other">
                <label for="gender-other">Other</label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Hobbies</legend>
            <p>
                <input type="checkbox" id="hobby-reading" name="hobbies" value="Reading">
                <label for="hobby-reading">Running</label><br>
                
                <input type="checkbox" id="hobby-traveling" name="hobbies" value="Traveling">
                <label for="hobby-traveling">Gym</label><br>
                
                <input type="checkbox" id="hobby-sports" name="hobbies" value="Sports">
                <label for="hobby-sports">Hiking</label>
            </p>
        </fieldset>

        <p>
            <label for="comments">Additional Comments:</label><br>
            <textarea id="comments" name="additionalComments" rows="5" cols="40"></textarea>
        </p>

        <p>
            <button type="submit">Submit</button>
        </p>

    </form>

</body>
</html>
